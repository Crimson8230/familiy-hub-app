# Default: fresh preview on an isolated device. With explicit authorization,
# REQUIRE_EMPTY=false and a new CHILD_PREFIX preserve an existing test inventory.
# Stop Metro and disable device networking BEFORE invoking this flow.
# Deliberately never clear app data or the iOS Keychain here.
appId: com.familyhub.app
name: Offline account creation, process restart and duplicate rejection
env:
  REQUIRE_EMPTY: ${REQUIRE_EMPTY || 'true'}
  CHILD_PREFIX: ${CHILD_PREFIX || 'Offline Kind'}
---
- launchApp
- runFlow:
    when:
      true: ${REQUIRE_EMPTY === 'true'}
    commands:
      - assertVisible: Noch keine Schulkonten gespeichert. Füge ein Schulkonto hinzu.
- assertVisible: Schulkonten
- assertNotVisible: ${CHILD_PREFIX + ' 01'}
- evalScript: ${output.number = 1}
- repeat:
    times: 10
    commands:
      - evalScript: "${output.child = CHILD_PREFIX + ' ' + (output.number < 10 ? '0' : '') + output.number}"
      - runFlow:
          file: helpers/fill-account.yaml
          env:
            CHILD: ${output.child}
            SCHOOL: "${output.number % 2 === 1 ? 'grundschule' : 'mittelschule'}"
      - tapOn:
          id: account-save
      - extendedWaitUntil:
          visible: Schulkonten
          timeout: 10000
      - scrollUntilVisible:
          element:
            text: Schulkonten
          direction: UP
      - scrollUntilVisible:
          element:
            text: ${output.child}
      - assertVisible: ${output.child}
      - assertNotVisible: synthetic-offline-user
      - assertNotVisible: synthetic-offline-password
      - evalScript: ${output.number = output.number + 1}
# A real process stop/start, preserving the encrypted DB and secure-store key.
- stopApp
- launchApp
- runFlow: helpers/assert-accounts.yaml
# Canonical identity is independent of whitespace, case and selected school.
- runFlow:
    file: helpers/fill-account.yaml
    env:
      CHILD: ${' ' + CHILD_PREFIX.toLowerCase() + ' 01 '}
      SCHOOL: mittelschule
- tapOn:
    id: account-save
- assertVisible: Für dieses Kind gibt es bereits ein Schulkonto.
- scrollUntilVisible:
    element:
      id: account-cancel
- tapOn:
    id: account-cancel
- stopApp
- launchApp
- runFlow: helpers/assert-accounts.yaml
- scrollUntilVisible:
    element:
      text: Schulkonten
    direction: UP
- assertVisible: ${CHILD_PREFIX + ' 01'}
- assertNotVisible: ${CHILD_PREFIX.toLowerCase() + ' 01'}
