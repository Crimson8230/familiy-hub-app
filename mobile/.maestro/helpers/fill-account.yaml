appId: com.familyhub.app
---
- scrollUntilVisible:
    element:
      id: account-add
- tapOn:
    id: account-add
- tapOn:
    id: account-childName
- inputText: ${CHILD}
- assertVisible: ${CHILD}
- runFlow:
    file: dismiss-keyboard.yaml
    env:
      FIELD_LABEL: ^Kind$
- tapOn:
    id: account-school-${SCHOOL}
- scrollUntilVisible:
    element:
      id: account-username
- tapOn:
    id: account-username
- inputText: synthetic-offline-user
- assertVisible: synthetic-offline-user
- runFlow:
    file: dismiss-keyboard.yaml
    env:
      FIELD_LABEL: ^Benutzername$
- scrollUntilVisible:
    element:
      id: account-password
- tapOn:
    id: account-password
- inputText: synthetic-offline-password
- waitForAnimationToEnd
- runFlow:
    file: dismiss-keyboard.yaml
    env:
      FIELD_LABEL: ^Passwort$
- scrollUntilVisible:
    element:
      id: account-save
