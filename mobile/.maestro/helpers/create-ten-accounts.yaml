appId: com.familyhub.app
name: Offline creation of ten accounts
env:
  REQUIRE_EMPTY: ${REQUIRE_EMPTY || 'true'}
  CHILD_PREFIX: ${CHILD_PREFIX || 'Offline Kind'}
---
- extendedWaitUntil:
    visible: Schulkonten
    timeout: 10000
- runFlow:
    when:
      true: ${REQUIRE_EMPTY === 'true'}
    commands:
      - assertVisible: Noch keine Schulkonten gespeichert. Füge ein Schulkonto hinzu.
- assertNotVisible: ${CHILD_PREFIX + ' 01'}
- evalScript: ${output.number = 1}
- repeat:
    times: 10
    commands:
      - evalScript: "${output.child = CHILD_PREFIX + ' ' + (output.number < 10 ? '0' : '') + output.number}"
      - runFlow:
          file: fill-account.yaml
          env:
            CHILD: ${output.child}
            SCHOOL: "${output.number % 2 === 1 ? 'grundschule' : 'mittelschule'}"
      - tapOn:
          id: account-save
      - scrollUntilVisible:
          element:
            text: Schulkonten
          direction: UP
      - scrollUntilVisible:
          element:
            text: ${output.child}
      - assertVisible: ${output.child}
      - assertNotVisible: synthetic-offline-user
      - assertNotVisible: synthetic-offline-password
      - evalScript: ${output.number = output.number + 1}
